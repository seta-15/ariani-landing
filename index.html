<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ariani</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #1e3c72, #2a5298);
      color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      background-color: rgba(0, 0, 0, 0.45);
      padding: 2.5rem;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      max-width: 420px;
      width: 90%;
    }

    h1 {
      font-size: 2.6rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      color: #d6d6d6;
      line-height: 1.6;
    }

    .email {
      margin-top: 1.5rem;
      font-size: 1.05rem;
    }

    .email a {
      color: #9fd3ff;
      text-decoration: none;
      font-weight: 600;
    }

    .email a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #b0b0b0;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Selamat Datang di Ariani</h1>

    <p>
      Domain ini hanya dipergunakan untuk keperluan email.<br>
      Terima kasih telah berkunjung.
    </p>

    <div class="email">
      📧 Kontak:
      <span id="email"></span>
    </div>

    <footer>
      © <span id="year"></span> ariani.my.id · Hak cipta dilindungi
    </footer>
  </div>

  <!-- Script: anti-spam email + auto year -->
  <script>
    // Email obfuscation
    const user = "info";
    const domain = "ariani.my.id";
    document.getElementById("email").innerHTML =
      `<a href="mailto:${user}@${domain}">
        ${user}@${domain}
      </a>`;

    // Auto update year
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
